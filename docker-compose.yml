services:
  api:
    build: .
    image: sebastiangranados1456/bluevelvet-api:latest
    container_name: bluevelvet-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bluevelvet
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SEED_PASSWORD: ${SEED_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bluevelvet-net

  postgres:
    image: postgres:16-alpine
    container_name: bluevelvet-postgres
    environment:
      POSTGRES_DB: bluevelvet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bluevelvet-net

volumes:
  postgres-data:

networks:
  bluevelvet-net:
    driver: bridge
