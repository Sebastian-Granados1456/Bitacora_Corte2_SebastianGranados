spring.application.name=bluevelvet

# Perfil activo por defecto: H2 en memoria (no requiere nada instalado).
# Para usar PostgreSQL en su lugar, ejecuta con: -Dspring.profiles.active=postgres
# En Docker y Azure se usa el perfil "docker" (SPRING_PROFILES_ACTIVE=docker)
spring.profiles.active=h2

# Seguridad: los valores reales llegan por variables de entorno, nunca en Git
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000
app.seed-password=${SEED_PASSWORD:}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Nunca devolver el stack trace al cliente
server.error.include-stacktrace=never
