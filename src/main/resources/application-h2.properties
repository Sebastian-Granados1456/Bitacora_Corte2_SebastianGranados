# Base de datos H2 en memoria: se borra al reiniciar la app, pero SI usa
# JPA/Hibernate real con SQL real. Ideal para desarrollar y probar rapido.
spring.datasource.url=jdbc:h2:mem:bluevelvet
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola de H2 deshabilitada: la seguridad bloquea iframes (X-Frame-Options: DENY)
spring.h2.console.enabled=false

# Hibernate crea/actualiza las tablas automaticamente a partir de las @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Valores SOLO para desarrollo local con H2. En Docker/Azure se usan variables de entorno.
