# Base de datos H2 en memoria: se borra al reiniciar la app, pero SI usa
# JPA/Hibernate real con SQL real. Ideal para desarrollar y probar rapido.
spring.datasource.url=jdbc:h2:mem:bluevelvet
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver las tablas en el navegador:
# http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:bluevelvet)
spring.h2.console.enabled=true

# Hibernate crea/actualiza las tablas automaticamente a partir de las @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
