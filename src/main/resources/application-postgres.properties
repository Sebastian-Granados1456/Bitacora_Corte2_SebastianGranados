# Base de datos PostgreSQL real: persiste los datos entre reinicios.
# Requiere tener PostgreSQL instalado y corriendo, con una base creada
# llamada "bluevelvet" (o cambia el nombre en la URL de abajo).
#
# Para usar este perfil: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/bluevelvet
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
