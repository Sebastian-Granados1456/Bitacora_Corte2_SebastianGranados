name: CD — Deploy PROD

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bluevelvet-api

jobs:
  build-prod:
    name: Build imagen PROD
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Pruebas antes de producir la imagen
        run: mvn verify --no-transfer-progress
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags de version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-prod:
    name: Desplegar a PROD
    needs: build-prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Variables de entorno de PROD
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          app-settings-json: |
            [
              {"name": "SPRING_PROFILES_ACTIVE", "value": "docker"},
              {"name": "WEBSITES_PORT", "value": "8080"},
              {"name": "JAVA_TOOL_OPTIONS", "value": "-Xmx256m"},
              {"name": "DB_HOST", "value": "${{ secrets.DB_HOST }}"},
              {"name": "DB_NAME", "value": "bluevelvet_prod"},
              {"name": "DB_USER", "value": "${{ secrets.DB_USER }}"},
              {"name": "DB_PASSWORD", "value": "${{ secrets.DB_PASSWORD }}"},
              {"name": "DB_PARAMS", "value": "?sslmode=require"},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET_PROD }}"},
              {"name": "SEED_PASSWORD", "value": "${{ secrets.SEED_PASSWORD }}"}
            ]
      - name: Desplegar contenedor en PROD
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          sitecontainers-config: >-
            [{
              "name": "main",
              "image": "index.docker.io/${{ env.IMAGE_NAME }}:${{ needs.build-prod.outputs.version }}",
              "targetPort": "8080",
              "isMain": true,
              "inheritAppSettingsAndConnectionStrings": true
            }]

  notify:
    name: Resumen
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "PROD desplegado: ${{ github.ref_name }}"
