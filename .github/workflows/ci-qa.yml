name: CI — Build · Test · Deploy QA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bluevelvet-api

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Ejecutar pruebas
        run: mvn verify --no-transfer-progress
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

  build-and-push:
    name: Build imagen Docker
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:qa-latest
            ${{ env.IMAGE_NAME }}:qa-${{ github.sha }}

  deploy-qa:
    name: Desplegar a QA
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Variables de entorno de QA
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          app-settings-json: |
            [
              {"name": "SPRING_PROFILES_ACTIVE", "value": "docker"},
              {"name": "WEBSITES_PORT", "value": "8080"},
              {"name": "JAVA_TOOL_OPTIONS", "value": "-Xmx256m"},
              {"name": "DB_HOST", "value": "${{ secrets.DB_HOST }}"},
              {"name": "DB_NAME", "value": "bluevelvet_qa"},
              {"name": "DB_USER", "value": "${{ secrets.DB_USER }}"},
              {"name": "DB_PASSWORD", "value": "${{ secrets.DB_PASSWORD }}"},
              {"name": "DB_PARAMS", "value": "?sslmode=require"},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET_QA }}"},
              {"name": "SEED_PASSWORD", "value": "${{ secrets.SEED_PASSWORD }}"}
            ]
      - name: Desplegar contenedor en QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          sitecontainers-config: >-
            [{
              "name": "main",
              "image": "index.docker.io/${{ env.IMAGE_NAME }}:qa-${{ github.sha }}",
              "targetPort": "8080",
              "isMain": true,
              "inheritAppSettingsAndConnectionStrings": true
            }]
